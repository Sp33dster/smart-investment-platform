spring:
  application:
    name: smart-investment-platform

  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/investment_db
    username: investment_user
    password: investment_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.investment: DEBUG
    org.springframework.security: DEBUG

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000