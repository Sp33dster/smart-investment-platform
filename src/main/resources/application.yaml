spring:
  application:
    name: smart-investment-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/investment_db
    username: investment_user
    password: investment_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.investment: DEBUG
    org.springframework.security: DEBUG