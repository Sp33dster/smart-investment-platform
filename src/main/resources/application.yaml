spring:
  application:
    name: smart-investment-platform

  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/investment_db
    username: investment_user
    password: investment_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

